<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Tema, ilk boyamadan önce uygulanır; yoksa koyu temada beyaz yanıp sönme olur -->
		<script>
			let saved = null;
			try {
				saved = localStorage.getItem('theme');
			} catch {
				// depolama kapalıysa sistem temasına göre karar verilir
			}
			const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
			document.documentElement.classList.toggle('dark', dark);
		</script>

		<title>Selim Yalınkılıç · Senior Frontend Developer</title>
		<meta
			name="description"
			content="Selim Yalınkılıç — Senior Frontend Developer at Shopier, Istanbul. Building fast, accessible interfaces since 2017, and owning web and mobile test automation."
		/>
		<meta name="author" content="Selim Yalınkılıç" />
		<link rel="canonical" href="https://www.selimyalinkilic.me/" />

		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://www.selimyalinkilic.me/" />
		<meta property="og:site_name" content="Selim Yalınkılıç" />
		<meta property="og:title" content="Selim Yalınkılıç · Senior Frontend Developer" />
		<meta
			property="og:description"
			content="Senior Frontend Developer at Shopier, Istanbul. Building fast, accessible interfaces since 2017."
		/>
		<meta property="og:image" content="https://www.selimyalinkilic.me/images/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Hi! I'm Selim — Senior Frontend Developer at Shopier" />
		<meta property="og:locale" content="en_US" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://www.selimyalinkilic.me/images/og.jpg" />

		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#D9E9FB" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0E1430" media="(prefers-color-scheme: dark)" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
